name: CI/CD and security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
  workflow_dispatch:
  
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  packages: write
  contents: write

jobs:
# ---------------------------------------
  # Job about linting and unit tests
# ---------------------------------------
  lint-and-test:
    name: Lint and unit test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.x"
          cache: "pip"

      - name: Install dependences
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Lint python code with ruff
        run: | 
          ruff check app/

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Run pytest
        run: | 
          pytest -v

# ----------------------------------------------------
  # Job about security on code and dependencies (SCA)
# ----------------------------------------------------
  security-scan:
    name: Source and dependency Scan
    runs-on: ubuntu-24.04
    needs: [lint-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on filesystem
        uses: aquasecurity/trivy-action@master
        with: 
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "1"

# ---------------------------------------------------------
  # Job about build container, image scan and push on GHCR
# ---------------------------------------------------------
  build-and-scan-image:
    name: Build, Scan and Publish Image
    runs-on: ubuntu-24.04
    needs: [security-scan]
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
           registry: ${{ env.REGISTRY }}
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (lags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with: 
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image locally (for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          load: true
          tags: devops-showcase-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scanner on Container Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-showcase-api:test
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true 

      - name: Push Docker Images to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with: 
          context: app
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Update GitOps image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          python3 scripts/update_gitops_tag.py "$SHORT_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/helm/devops-api/values.yaml
          git diff --staged --quiet || git commit -m "chore(gitops): update image tag to ${SHORT_SHA} [skip ci]"
